name: Build Windows and macOS apps

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/build.yml"
      - "UMK.windows.spec"
      - "UMK.macOS.spec"
      - "requirements.txt"
      - "src/**"
      - "config/**"
      - "icons/**"
      - "hand_landmarker.task"

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Build executable
        run: python -m PyInstaller --noconfirm --clean UMK.windows.spec
      - name: Upload executable
        uses: actions/upload-artifact@v4
        with:
          name: UMK-Windows
          path: dist/UMK.exe
          if-no-files-found: error

  build-macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Build app bundle
        run: python -m PyInstaller --noconfirm --clean UMK.macOS.spec
      - name: Verify app bundle signature
        run: codesign --verify --deep --strict dist/UMK.app
      - name: Package app bundle
        run: ditto -c -k --sequesterRsrc --keepParent dist/UMK.app dist/UMK-macOS.zip
      - name: Upload app bundle
        uses: actions/upload-artifact@v4
        with:
          name: UMK-macOS
          path: dist/UMK-macOS.zip
          if-no-files-found: error
